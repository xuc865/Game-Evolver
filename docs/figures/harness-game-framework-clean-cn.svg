    <rect class="teal" x="176" y="45" width="48" height="38" rx="5"/>
    <text class="tiny" x="20" y="94">artifact</text>
    <text class="tiny" x="98" y="94">harness</text>
    <text class="tiny" x="181" y="94">logs</text>
  </g>
  <path class="line-green" d="M172 454 L172 498"/>
  <g transform="translate(48 498)">
    <rect class="soft-panel" width="248" height="104" rx="10"/>
    <text class="label" x="45" y="42">更多迭代</text>
    <text class="text" x="88" y="68">...</text>
  </g>
  <path class="line-green" d="M172 602 L172 646"/>
  <g transform="translate(48 646)">
    <rect class="soft-panel" width="248" height="100" rx="10"/>
    <text class="label" x="62" y="28">Episode k</text>
    <rect class="blue" x="22" y="45" width="48" height="38" rx="5"/>
    <rect class="yellow" x="99" y="45" width="48" height="38" rx="5"/>
    <rect class="teal" x="176" y="45" width="48" height="38" rx="5"/>
    <text class="tiny" x="20" y="94">artifact</text>
    <text class="tiny" x="98" y="94">harness</text>
    <text class="tiny" x="181" y="94">evidence</text>
  </g>

  <!-- Meta level -->
  <rect class="dash-panel" x="358" y="104" width="842" height="286"/>
  <rect class="head-blue" x="374" y="120" width="342" height="34"/>
  <text class="head-text" x="390" y="144">外环：Harness Generation 演化</text>
  <rect x="374" y="165" width="305" height="202" fill="url(#diag-blue)" opacity="0.42"/>

  <rect class="box yellow" x="394" y="188" width="178" height="72"/>
  <text class="label" x="417" y="216">证据池</text>
  <text class="text" x="417" y="237">run 摘要 / replay</text>
  <text class="text" x="417" y="255">失败模式 / element stats</text>

  <rect class="box gray" x="607" y="188" width="180" height="72"/>
  <text class="label" x="630" y="216">Harness 库</text>
  <text class="text" x="630" y="237">profiles / modules</text>
  <text class="text" x="630" y="255">tools / elements</text>

  <rect class="box green" x="394" y="286" width="393" height="60"/>
