    <rect class="soft-panel" width="248" height="100" rx="10"/>
    <text class="label" x="68" y="28">Episode 1</text>
    <rect class="blue" x="22" y="45" width="48" height="38" rx="5"/>
    <rect class="yellow" x="99" y="45" width="48" height="38" rx="5"/>
    <rect class="teal" x="176" y="45" width="48" height="38" rx="5"/>
    <text class="tiny" x="20" y="94">artifact</text>
    <text class="tiny" x="98" y="94">harness</text>
    <text class="tiny" x="181" y="94">logs</text>
  </g>
  <path class="line-green" d="M172 310 L172 354"/>
