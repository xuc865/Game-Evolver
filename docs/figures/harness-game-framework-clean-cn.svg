  <text class="text" x="416" y="556">task specification</text>
  <text class="text" x="416" y="574">seed artifact</text>

  <rect class="box yellow" x="392" y="614" width="178" height="74"/>
  <text class="label" x="416" y="641">冻结 Harness</text>
  <text class="text" x="416" y="662">从 champion profile 读取</text>
  <text class="text" x="416" y="680">episode 内不变</text>

  <circle class="circle" cx="666" cy="596" r="52" fill="#fecaca"/>
