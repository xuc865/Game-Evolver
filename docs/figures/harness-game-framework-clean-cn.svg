  <rect class="head-red" x="374" y="434" width="330" height="34"/>
  <text class="head-text" x="390" y="458">内环：Harnessed Game Generation</text>
  <rect x="374" y="480" width="805" height="274" fill="url(#diag-red)" opacity="0.32"/>

  <rect class="box red" x="392" y="508" width="178" height="74"/>
