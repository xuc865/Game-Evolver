  <text class="label" x="610" y="672">Game Agent</text>

  <rect class="box blue" x="770" y="510" width="185" height="84"/>
  <text class="label" x="796" y="538">Feedback 编译器</text>
  <text class="text" x="796" y="561">score / probes / history</text>
  <text class="text" x="796" y="580">harness instruction</text>

  <rect class="box green" x="770" y="628" width="185" height="84"/>
  <text class="label" x="796" y="656">候选 Artifact</text>
  <text class="text" x="796" y="679">game output</text>
  <text class="text" x="796" y="698">snapshot and evidence</text>

  <rect class="box teal" x="994" y="510" width="166" height="84"/>
  <text class="label" x="1023" y="538">Evaluator</text>
  <text class="text" x="1023" y="561">gates / score</text>
  <text class="text" x="1023" y="580">benchmark result</text>

  <rect class="box green" x="994" y="628" width="166" height="84"/>
  <text class="label" x="1023" y="656">Verifier</text>
  <text class="text" x="1023" y="679">hard：逐项 &gt;= baseline</text>
  <text class="text" x="1023" y="698">soft：总和 &gt;= baseline</text>

