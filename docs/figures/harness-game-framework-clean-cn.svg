<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="980" viewBox="0 0 1680 980" role="img" aria-labelledby="title desc">
  <title id="title">Harness-Game 双环演化框架</title>
  <desc id="desc">仿论文信息图风格绘制的 harness-game 框架图，展示外环 harness 演化、内环 artifact 演化、内环双 rubric 验证、工具集合、评估反馈与迭代工作目录。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#c2410c"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#15803d"/>
    </marker>
    <marker id="arrow-gray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#64748b"/>
    </marker>
    <pattern id="diag-blue" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#bfdbfe" stroke-width="3"/>
    </pattern>
    <pattern id="diag-red" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#fecaca" stroke-width="3"/>
    </pattern>
    <pattern id="diag-green" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#bbf7d0" stroke-width="3"/>
    </pattern>
    <pattern id="diag-yellow" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#fde68a" stroke-width="3"/>
    </pattern>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <style>
      .root { fill: #faf7ed; }
      .title { font: 700 30px "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 14px "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #475569; }
      .panel { fill: #fffdf7; stroke: #1f2937; stroke-width: 2.2; filter: url(#shadow); }
      .dash-panel { fill: #fffdf7; stroke: #111827; stroke-width: 2.4; stroke-dasharray: 14 10; filter: url(#shadow); }
      .soft-panel { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.7; filter: url(#shadow); }
      .head-blue { fill: #2563eb; }
      .head-red { fill: #dc2626; }
      .head-green { fill: #15803d; }
      .head-olive { fill: #7c8700; }
      .head-text { font: 700 18px "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #ffffff; }
      .label { font: 700 15px "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #111827; }
      .text { font: 400 12px "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #334155; }
      .tiny { font: 400 10.5px "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #475569; }
      .mono { font: 400 11px "SFMono-Regular", Consolas, monospace; fill: #334155; }
      .box { rx: 8; stroke-width: 1.6; filter: url(#shadow); }
      .blue { fill: #eff6ff; stroke: #60a5fa; }
      .red { fill: #fff1f2; stroke: #fb7185; }
      .green { fill: #ecfdf5; stroke: #34d399; }
      .yellow { fill: #fefce8; stroke: #eab308; }
      .purple { fill: #faf5ff; stroke: #a78bfa; }
      .gray { fill: #f8fafc; stroke: #94a3b8; }
      .teal { fill: #f0fdfa; stroke: #2dd4bf; }
      .line-blue { fill: none; stroke: #2563eb; stroke-width: 3; marker-end: url(#arrow-blue); }
      .line-red { fill: none; stroke: #c2410c; stroke-width: 3; marker-end: url(#arrow-red); }
      .line-green { fill: none; stroke: #15803d; stroke-width: 3; marker-end: url(#arrow-green); }
      .line-gray { fill: none; stroke: #64748b; stroke-width: 2.4; marker-end: url(#arrow-gray); }
      .dashed { stroke-dasharray: 8 7; }
      .circle { stroke: #334155; stroke-width: 2; filter: url(#shadow); }
      .icon { font: 700 25px "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #111827; }
    </style>
  </defs>

  <rect class="root" width="1680" height="980"/>
  <text class="title" x="42" y="48">Harness-Game 双环演化框架</text>
  <text class="subtitle" x="42" y="73">外环演化 harness generation 链路；内环在冻结 harness 下生成 game artifact，并在 verifier 中执行 hard/soft rubric 验证。</text>

  <!-- Left working directory -->
  <rect class="panel" x="24" y="104" width="296" height="808" rx="14"/>
  <circle class="circle" cx="77" cy="148" r="37" fill="#d9f99d"/>
  <text class="icon" x="60" y="157">▣</text>
  <text class="label" x="130" y="139">工作目录</text>
  <text class="text" x="130" y="161">每次 episode 都留下可追踪证据</text>

