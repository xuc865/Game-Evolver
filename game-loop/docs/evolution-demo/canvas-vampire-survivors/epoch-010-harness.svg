<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300"><rect width="400" height="300" fill="#f7f3ec"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2b8c8c"/></marker></defs><text x="20" y="24" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#24313a">Canvas Vampire Survivors</text><text x="20" y="42" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#65757d">Epoch 10 · REJECT</text><text x="20" y="58" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#65757d">Seed retained because the candidate was incomplete</text><text x="20" y="272" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#65757d">This checkpoint exposes the boundary where the chain refused to promote</text><rect x="20.0" y="86" width="82.0" height="34" rx="8" fill="#f8e8c7" stroke="#24313a" stroke-width="1.2"/><text x="61.0" y="100.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="8" fill="#24313a">Task brief</text><text x="61.0" y="112.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="8" fill="#24313a">+ constraints</text><rect x="110.0" y="86" width="82.0" height="34" rx="8" fill="#e3eaf0" stroke="#24313a" stroke-width="1.2"/><text x="151.0" y="100.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="8" fill="#24313a">Seed artifact</text><text x="151.0" y="112.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="8" fill="#24313a">retained</text><rect x="200.0" y="86" width="82.0" height="34" rx="8" fill="#f6d8d3" stroke="#24313a" stroke-width="1.2"/><text x="241.0" y="100.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="8" fill="#24313a">Coverage gap</text><text x="241.0" y="112.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="8" fill="#24313a">review</text><rect x="290.0" y="86" width="82.0" height="34" rx="8" fill="#f6d8d3" stroke="#24313a" stroke-width="1.2"/><text x="331.0" y="100.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="8" fill="#24313a">No promotion</text><text x="331.0" y="112.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="8" fill="#24313a">candidate</text><line x1="102.0" y1="103" x2="110.0" y2="103" stroke="#2b8c8c" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="192.0" y1="103" x2="200.0" y2="103" stroke="#2b8c8c" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="282.0" y1="103" x2="290.0" y2="103" stroke="#2b8c8c" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="20.0" y="170" width="352.0" height="36" rx="8" fill="#f6d8d3" stroke="#24313a" stroke-width="1.2"/><text x="196.0" y="185.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="8" fill="#24313a">Verification</text><text x="196.0" y="197.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="8" fill="#24313a">did not close</text><line x1="331.0" y1="120" x2="196.0" y2="170" stroke="#2b8c8c" stroke-width="1.6" marker-end="url(#arrow)"/><text x="200" y="245" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#65757d">A useful contrast case: the structure stays thin when the candidate is incomplete</text></svg>