<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 724 220" width="724" height="220"
     fill-rule="evenodd" role="img" aria-label="Chudopoly"><title>Chudopoly</title>
  <!--
    The CHUDOPOLY wordmark. ARCHITECTURE 0.3: a logo is drawn, not set. This is
    hand-authored geometry, not type. The paths below are copied VERBATIM from the
    ratified mark in public/index.html (.brand-mark); the only change is that its
    three CSS custom properties are resolved to their literal token values, because
    a standalone file has no cascade to inherit them from:

        card-stock  becomes  #FBF8F1   (ART-DIRECTION 2, shared token)
        ink         becomes  #14161A   (ART-DIRECTION 2, 17.08:1 on stock)
        ca-drop     becomes  #A2977E   (already the inline fallback)

    Permitted outside public/ by ARCHITECTURE 0.3 amendment (d) 2026-08-07: docs
    SVG and PNG referenced only by repo docs. GitHub sanitises inline SVG in
    Markdown, so the README cannot show the mark without a file.

    ONE FILE SERVES BOTH GITHUB THEMES, deliberately. ART-DIRECTION 0: "The cards
    do not change between themes, they are cream printed stock in both. The table
    changes; the objects don't." The mark carries its own card stock as an opaque
    plate, so on GitHub's dark theme it reads as a printed card lying on a dark
    table, which is the thesis rather than a compromise. No picture-element swap
    is needed and none should be added.

    Note for anyone editing this comment: XML forbids a double hyphen inside a
    comment, so the CSS variable names above are written without their leading
    dashes on purpose. Writing them the natural way makes this file unparseable,
    which is how it shipped broken the first time.
  -->
