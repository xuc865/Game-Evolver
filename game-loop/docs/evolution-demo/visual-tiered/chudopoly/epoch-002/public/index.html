<!-- Link preview. __ORIGIN__ is substituted per request by server.js (og:url
     and og:image must be ABSOLUTE, crawlers do not run JS, and the same file
     ships to dev and prod — CANONICAL_ORIGIN pins it once a canonical domain
     is settled, the request host serves until then). The image itself is a
     route: /og.png is generated by server/og.js from the same geometry the
     page renders — the .brand-mark below and cardart.js's card back — so §0.3
     ships no binary and the preview cannot drift from the mark. -->
<link rel="canonical" href="__ORIGIN__/">

<meta property="og:site_name" content="CHUDOPOLY">
<meta property="og:title" content="Chudopoly — Play Monopoly Deal Online Free">

<!-- The app icon is the DECK MARK — the pre-press alignment target from the
     card back (844f99e) — reversed out of a solid --card-back tile, so the tab
     carries an object rather than an outline. The SVG favicon is generated by
     server/icon.js and served from a route (an .svg FILE is still banned).
     The PNGs are the §0.3 amendment (f) set: committed under /icons/ but
     rendered by tools/genicons.mjs from server/icon.js's OWN geometry —
     test/pwa.test.js fails if the files differ from a fresh render, and
     checkAssets caps that directory at exactly the six. Committed beats a
     route for the one surface that outlives the tab: an installed launcher
     icon is fetched by the OS installer, and a static file survives server
     refactors that a route allowlist does not. -->
<link rel="icon" type="image/svg+xml" sizes="any" href="/icon.svg?v=1">
<link rel="alternate icon" type="image/png" sizes="32x32" href="/icons/icon-32.png?v=1">

<!-- Structured data. NOT a classic script: application/ld+json is data, never
     executed, so it does not touch §0.4's ban (test/ui-contract.test.js asserts
     exactly one EXECUTABLE script and pins every other tag to this type). The
     __ORIGIN__ placeholder is substituted per request like the OG tags above,
     because schema URLs must be absolute too. -->
<script type="application/ld+json">
{"@context":"https://schema.org","@type":["VideoGame","WebApplication"],
"name":"Chudopoly","alternateName":"Chudopoly \u2014 Monopoly Deal online",

"applicationCategory":"GameApplication","operatingSystem":"Any modern web browser",
"browserRequirements":"Requires JavaScript and WebSocket support",
"genre":["Card game","Multiplayer"],"playMode":["MultiPlayer","SinglePlayer"],
"numberOfPlayers":{"@type":"QuantitativeValue","minValue":2,"maxValue":5},
"gamePlatform":"Web browser","inLanguage":"en",
"offers":{"@type":"Offer","price":"0","priceCurrency":"USD",
"availability":"https://schema.org/InStock"},
"license":"https://github.com/8tp/chudopoly/blob/main/LICENSE",
"sameAs":["https://github.com/8tp/chudopoly"]}
</script>

<link rel="stylesheet" href="/style/base.css?v=1">

<body>
<div id="app">

  <!-- ── HOME ───────────────────────────────────────────────────────────
       ART §3.3: "the home screen IS the table, seen from above, with the deck
       sitting on it and the actions painted into the apron as markings."

       COMPOSITION, round 6. Measured on the previous build at 1440x900: the ink
       occupied 55.6% of the viewport height with 22.2% dead apron above it and
       22.2% below, and the two masses sat at 30% and 66% of the width with
       nothing between them. The bounding box was dead-centre; the WEIGHT was
       not, and a menu made of two half-weight objects floating in a hole is
       what "unfinished" looks like.

       The fix is not to centre the wordmark and hope. It is that MARKINGS RUN
       TO THE EDGE OF THE FRAME AND OBJECTS DO NOT. A painted apron is anchored
       by its lines, not by its furniture, so this screen is three registers:

         head   the wordmark plate, painted on the concrete, with a rule under
                it that reaches both edges of the viewport
         table  the deck — the largest object on screen, because the deck IS
                the subject and a card game's menu should show cards
         rail   the hold-short line, edge to edge, with the marshalling area
                painted along it: call sign, the ink slab, the alternates, and
                the two edge marks (how to play; sound)

       Every edge of the frame now carries a marking, the wordmark is centred
       WITHOUT floating (the rule under it is what holds it down), and the deck
       is the hero it was always supposed to be. Same three registers at every
       width — only the rail's internal arrangement changes. -->
  <section id="screen-home" class="screen screen-home">
    <div class="home">

      <header class="home-head">
        <!-- The h1 was a drawing. `aria-label` serves a screen reader and an
             SVG <title> serves a tooltip, but neither is TEXT in the document,
             so the page's most important heading said nothing a search engine
             could read. The .sr-only line is the heading in words; the mark
             stays exactly as drawn. -->
        <h1 class="brand-title">
          <span class="sr-only">Chudopoly — play Monopoly Deal online free, 2–5 players in your browser</span>
          <svg class="brand-mark" viewBox="0 0 724 220" fill-rule="evenodd"
               aria-hidden="true" focusable="false">
            <rect width="724" height="220" fill="var(--card-stock)"/>
            <path fill="var(--ink)" d="M13 13 H711 V207 H13 Z M20 20 H704 V200 H20 Z"/>
            <g fill="var(--ink)">
              <path d="M5 5 H84 V12 H12 V60 H5 Z"/>
              <path d="M719 5 V60 H712 V12 H640 V5 Z"/>
              <path d="M5 215 V160 H12 V208 H84 V215 Z"/>
              <path d="M719 215 H640 V208 H712 V160 Z"/>
            </g>
            <g transform="translate(73 53)">
              <path fill="var(--ca-drop, #A2977E)" d="M16 0 H62 V20 H20 V80 H62 V100 H16 L0 84 V16 Z M72.0 0 H92.0 V40 H114.0 V0 H134.0 V100 H114.0
             V60 H92.0 V100 H72.0 Z M144.0 0 H164.0 V80 H186.0 V0 H206.0 V84 L190.0 100 H160.0 L144.0 84 Z
             M216.0 0 H262.0 L278.0 16 V84 L262.0 100 H216.0 Z M298.0 0 H328.0 L344.0 16 V84 L328.0 100
             H298.0 L282.0 84 V16 Z M350.0 0 H396.0 L412.0 16 V44 L396.0 60 H370.0 V100 H350.0 Z M429.0 0
             H459.0 L475.0 16 V84 L459.0 100 H429.0 L413.0 84 V16 Z M480.0 0 H500.0 V80 H542.0 V100 H480.0 Z
             M534.0 0 H556.0 L565.0 26 L574.0 0 H596.0 L575.0 48 V100 H555.0 V48 Z"/>
            </g>
            <g transform="translate(64 44)">
              <path fill="var(--ink)" d="M16 0 H62 V20 H20 V80 H62 V100 H16 L0 84 V16 Z M72.0 0 H92.0 V40 H114.0 V0 H134.0 V100 H114.0
             V60 H92.0 V100 H72.0 Z M144.0 0 H164.0 V80 H186.0 V0 H206.0 V84 L190.0 100 H160.0 L144.0 84 Z
             M216.0 0 H262.0 L278.0 16 V84 L262.0 100 H216.0 Z M236.0 20 H254.0 L258.0 24 V76 L254.0 80
             H236.0 Z M298.0 0 H328.0 L344.0 16 V84 L328.0 100 H298.0 L282.0 84 V16 Z M306.0 20 H320.0 L324.0
             24 V76 L320.0 80 H306.0 L302.0 76 V24 Z M350.0 0 H396.0 L412.0 16 V44 L396.0 60 H370.0 V100
             H350.0 Z M370.0 20 H388.0 L392.0 24 V36 L388.0 40 H370.0 Z M429.0 0 H459.0 L475.0 16 V84 L459.0
             100 H429.0 L413.0 84 V16 Z M437.0 20 H451.0 L455.0 24 V76 L451.0 80 H437.0 L433.0 76 V24 Z
             M480.0 0 H500.0 V80 H542.0 V100 H480.0 Z M534.0 0 H556.0 L565.0 26 L574.0 0 H596.0 L575.0 48
             V100 H555.0 V48 Z"/>
            </g>
            <!-- The GO chip lived here — a reversed revision-block bottom right.
                 OWNER RULING 2026-08-07: the game is CHUDOPOLY. The suffix was
                 inherited from the one-night build and never earned anything, and
                 the card back had already been saying CHUDOPOLY on its own. -->
          </svg>
        </h1>
        <p class="brand-sub">Monopoly Deal, flight-line edition. Three complete sets and you are wheels up.</p>
      </header>

      <!-- THE DECK IS BUILT, NOT WRITTEN.
           This element was 11 hand-authored spans: two copies of the Fighters
           and Space Force glyphs, a bespoke value coin at left:8%/bottom:7%
           that matched nothing on a real card, and a back carrying only the
           alignment target. The card art has been redrawn three times since
           those copies were made and they were stale on arrival — the owner's
           read was "tacky / not well made", and the reason is that they are not
           the cards. src/ui/home.js now fills this from table/cardart.js's own
           faceNode()/backNode(), so the menu shows the ACTUAL printed card, the
           coin sits where the card design puts it, and every future art change
           lands here for free. Decorative: aria-hidden, no [data-card-id], and
           nowhere near a .cardzone, so nothing that reconciles the table can
           mistake these for cards in play (§0.4). -->
      <div class="home-table">
        <div id="home-deck" class="home-deck" aria-hidden="true"></div>
        <!-- 106, not 104: buildDeck() returns 106 and has for some time. The
             literal was written by hand and then never re-read, which is the
             whole argument for the deck above it now being built from
             cardart.js rather than copied. A number nobody derives is a number
             that drifts. -->
        <p class="home-deck-tag">106 cards &middot; 2&ndash;5 seats</p>
      </div>

      <!-- the hold-short line and everything painted along it -->
      <div class="home-rail">
        <div class="home-actions">
          <p id="home-greet" class="home-greet" hidden></p>
          <div class="home-slot">
            <label class="field-label" for="name-input">Call sign</label>
            <input id="name-input" class="field" type="text" maxlength="16" autocomplete="off"
                   autocapitalize="characters" placeholder="Who is flying?">
          </div>
          <button id="btn-quick-play" class="btn btn-primary home-go" data-action="quick-play">Quick play vs bots</button>
          <div class="home-alt">
            <button id="btn-create-room" class="btn" data-action="create-room">Create room</button>
            <div class="home-join">
              <input id="code-input" class="field field-code" type="text" maxlength="4" autocomplete="off"
                     placeholder="CODE" aria-label="Room code">
              <button id="btn-join-room" class="btn" data-action="join-room">Join</button>
            </div>
          </div>
          <p id="home-error" class="error" role="alert" aria-live="polite"></p>
          <!-- Opt-in public listing (owner directive 2026-08-07): meaningful
               only for Create room, DEFAULT OFF, read by ui/home.js at the
               moment create-room fires. A native checkbox, no data-action —
               its state IS its meaning. -->
          <label class="home-public" for="public-toggle">
            <!-- The settings sheet's own switch pattern (content.css .switch):
                 the 44px wrapper is the control, the input fills it at opacity
                 0, the face is the drawing — the audited, contrast-measured
                 way this app draws a toggle. A bare 15px checkbox is a §0.9
                 refusal waiting to be measured. -->
            <span class="switch">
              <input id="public-toggle" class="switch-input" type="checkbox">
              <span class="switch-face" aria-hidden="true"></span>
            </span>
            <span>List my room publicly</span>
          </label>
          <!-- OPEN TABLES (owner directive 2026-08-07): the public-rooms
               browse. HIDDEN unless the poll finds at least one public lobby
               ("dont show browse games if there isnt any actual ones") — with
               zero rooms this screen is unchanged. Rows are built by
               ui/home.js via textContent only; joining goes through the same
               join path as a typed code. -->
          <div id="home-tables" class="home-tables" hidden></div>
        </div>

        <!-- THE RAIL'S LEFT CORNER IS THE READING CORNER, and it now carries
             two marks instead of one. Both are things you go and READ — the
             rules, and your own logbook — where the right corner is the dial
             you go and CHANGE. That split is why the flight log sits here and
             not next to Settings, and why it is a painted rail mark in the same
             vocabulary rather than a fourth ink slab in the marshalling area
             (ART §3.2: the rail already steps down in weight once).

             #btn-flight-log SHIPS HIDDEN AND STAYS HIDDEN AT ZERO FLIGHTS.
             ui/stats.js is the only thing that unhides it, on the frame the
             recorder banks a game. A mark that opens an empty box is pressed
             exactly once and teaches the player not to press it again — so
             until there is something to read, the corner is unchanged from the
             screen every first-timer already sees.

             .home-marks is styled in content.css, not ui.css: the rail's grid
             areas ("help actions settings" on desktop, two rows on a phone)
             live in ui.css, and this wrapper takes the `help` cell so no grid
             template has to change to fit a third mark. -->
        <div class="home-marks">
          <button class="btn btn-ghost home-help" data-action="help">How to play</button>
          <!-- A real ANCHOR to the rules document, not a data-action: /rules is a page,
               and a crawler that never runs the app finds the two documents through
               this link or not at all. pointer.js's route() ignores elements without a
               data-action, so navigation stays the browser's own — same contract as the
               GitHub mark below. "How to play" opens the in-game brief; this leaves. -->
          <a class="btn btn-ghost home-help" href="/rules">Rules</a>
          <button id="btn-flight-log" class="btn btn-ghost home-help home-log"
                  data-action="flight-log" hidden>Flight log</button>
          <!-- OWNER, 2026-08-07: "add a github icon/emblem to the home page so
               people can click on it easily and get to the project repository."
               The reading corner is where it belongs — a repository is a thing
               you go and READ, like the two marks beside it. A plain anchor, no
               data-action: pointer.js's route() ignores elements without one,
               so navigation is the browser's own. The mark is GitHub's octicon
               path inline (§0.3: authored as text, no binary), uncoloured —
               currentColor follows the ghost-button ink, which is the plain
               mark in both themes, not a recolour. -->
          <!-- NOT .btn-icon: that class paints the chrome glyph set's mask in
               a ::before (default --ico-close), which put a ✕ beside the
               octocat. This mark ships its own inline SVG. -->
          <a id="home-github" class="btn home-github"
             href="https://github.com/8tp/chudopoly" target="_blank" rel="noopener noreferrer"
             aria-label="Chudopoly on GitHub">
            <svg viewBox="0 0 16 16" width="20" height="20" aria-hidden="true" fill="currentColor">
              <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
            </svg>
          </a>
        </div>

        <!-- THE SOUND MARK FOLDED INTO THIS ONE, and the fold is the point.
             This corner used to carry a music toggle, added because §7's bed
             starts on the first pointerdown anywhere and the only switch lived
             inside the game screen's HUD — so tapping Quick Play bought a bed
             you could not silence until the table loaded. That control was a
             MITIGATION for a missing surface, and its own comment said so.
             The surface exists now, on all three screens, so keeping both would
             leave two adjacent marks in the same rail that both mean "audio",
             one of them a subset of the other — which is the redundancy ART
             §3.2 exists to stop, and it would also cost the rail a third corner
             it has no room for on a phone.

             The one thing the mark uniquely bought is kept and MEASURED, not
             assumed: pointer.js dispatches on window CAPTURE while main.js's
             audio unlock is a bubble-phase listener on the same window, so a
             press here runs first. ui/settings.js is imported for its side
             effect at module scope and opens the sheet from that capture-phase
             dispatch; the Sound and Music switches are the first two rows of
             it. Measured cold, mute-as-the-first-gesture: see ui/settings.js. -->
        <button id="btn-home-settings" class="btn btn-ghost home-settings mark-dial" data-action="settings">
          <span>Settings</span>
        </button>
      </div>

    </div>
  </section>

  <!-- ── LOBBY ──────────────────────────────────────────────────────────
       THE SAME THREE REGISTERS AS THE HOME SCREEN (see the comment above it,
       and commit 5c0bdc7). This screen was the one nobody had looked at — the
       owner has only ever played bot games — and the measurement says so.
       Measured in a REAL host lobby at 1280x720, host + 3 bots, the advanced
       disclosure CLOSED (tools cannot reach this state: a lobby broadcast
       carries no `game`, so store.self.id is never set and every shot on disk
       named `lobby@*` is the GUEST view with the host controls hidden):

         .lobby-panel     431 x 720, content 1138 -> 418px unreachable
         panel top        y -197   (the room code was ABOVE the viewport)
         Copy invite      y -124..-80   entirely off the top
         Launch Mission   y  805..849   85px past the bottom
         off-viewport     54 controls
         ink box          431 x 2531 = 33.6% x 351.5% of the viewport
         dead apron       33.2% either side

       `.screen-lobby` is `overflow: hidden` and the ONLY scroller was the
       58px seat list, so none of that was reachable by scrolling: on a
       1280x720 desktop with four seats the host could not press the one
       button the screen exists for. That is not a design complaint.

       So: head / body / rail, markings to the frame edge, objects inside it.

         head   ROOM + code + the invite, with a full-bleed rule under it —
                the same plate-and-rule the home screen opens with
         body   the 1fr row and the ONLY scroll container: two columns on a
                pointer screen (THE ROOM against THE RULES), one on a phone
         rail   the hold-short line, edge to edge, with Launch Mission painted
                in the marshalling area and the two secondary marks at the
                frame's corners — Leave room, and Settings

       Nothing in the rail can be pushed off the bottom by anything in the
       body, which is the invariant the old single column had no way to hold.
       The rail's corner marks are the SAME vocabulary as the home rail's, so
       Settings sits in the same place on both screens. -->
  <section id="screen-lobby" class="screen screen-lobby" hidden>
    <div class="lobby">

      <header class="lobby-head">
        <h2 class="lobby-title">ROOM <span id="lobby-code" class="lobby-code"></span></h2>
        <button id="btn-invite" class="btn btn-ghost lobby-invite" data-action="copy-invite">Copy invite link</button>
      </header>

      <!-- THE ONLY SCROLLER ON THIS SCREEN. No env(safe-area-inset-*) here or
           on anything inside it: `.screen` is the single inset owner and
           tools/checkClient.mjs fails a second one. -->
      <div id="lobby-body" class="lobby-body scroll-edge">

        <section class="lobby-col lobby-col-room" aria-labelledby="lobby-seats-head">
          <h3 id="lobby-seats-head" class="lobby-legend">The room</h3>
          <div id="lobby-players" class="lobby-players"></div>

          <div id="lobby-host" class="lobby-host" hidden>
            <div class="row">
              <label class="field-label" for="bot-mode">BOT</label>
              <select id="bot-mode" class="field">
                <option value="random">Random</option>
                <option value="conservative">Conservative</option>
                <option value="neutral" selected>Neutral</option>
                <option value="aggressive">Aggressive</option>
                <option value="chud">CHUD</option>
              </select>
              <button id="btn-add-bot" class="btn" data-action="add-bot">Add bot</button>
            </div>
            <div class="row">
              <label class="field-label" for="turn-timeout">TURN</label>
              <select id="turn-timeout" class="field">
                <option value="0">off</option>
                <option value="30">30s</option>
                <option value="60" selected>60s</option>
                <option value="120">120s</option>
              </select>
              <label class="field-label" for="response-timeout">REPLY</label>
              <select id="response-timeout" class="field">
                <option value="0">off</option>
                <option value="15">15s</option>
                <option value="30" selected>30s</option>
                <option value="60">60s</option>
              </select>
            </div>
          </div>
        </section>

        <!-- ui/lobby.js builds the ruleset picker into this column (host), or
             the "the host is choosing" note into it (guest). -->
        <section id="lobby-rules" class="lobby-col lobby-col-rules"></section>
      </div>

      <!-- the hold-short line and everything painted along it -->
      <div class="lobby-rail">
        <button class="btn btn-ghost lobby-mark lobby-leave" data-action="leave-room">Leave room</button>
        <div class="lobby-actions">
          <!-- The hint is ABOVE the slab, not under it. Under it, the last line
               of the screen was a sentence rather than the action, and at 1280×720
               it was the thing the viewport's bottom edge cut. It also reads in
               the right order now: the state, then the control that acts on it. -->
          <p id="lobby-hint" class="hint" aria-live="polite">Waiting for the host to launch&hellip;</p>
          <!-- MOVED OUT OF #lobby-host (P9). It used to be the last child of the
               host block, under ~850px of bot picker, clocks and presets, which
               is exactly how it ended up 85px below a 720px fold. It is pinned
               in the rail now and no amount of content above it can move it. -->
          <button id="btn-start" class="btn btn-primary lobby-go" data-action="start-game" hidden>Launch Mission</button>
        </div>
        <button class="btn btn-ghost lobby-mark lobby-settings mark-dial" data-action="settings">
          <span>Settings</span>
        </button>
      </div>

    </div>
  </section>

  <!-- ── GAME ───────────────────────────────────────────────────────── -->
  <section id="screen-game" class="screen screen-game" hidden>
    <header id="hud" class="hud">
      <div class="hud-left">
        <span id="hud-room" class="chip"></span>
        <span id="hud-conn" class="conn" title="Connection"></span>
      </div>
      <div class="hud-mid">
        <span id="hud-turn" class="hud-turn" aria-live="polite"></span>
        <span id="hud-plays" class="chip"></span>
        <span id="hud-timer" class="timer" hidden><span id="hud-timer-text" class="timer-text"></span></span>
      </div>
      <div class="hud-right">
        <!-- The glyphs are drawn in ui.css as masks (one per data-action), in the
             same solid-silhouette family as the card glyphs. The buttons ship
             empty: a Unicode dingbat here was the last generic mark in the app. -->
        <button id="btn-side" class="btn btn-icon" data-action="toggle-side" aria-label="Mission log and comms"></button>
        <button class="btn btn-icon" data-action="help" aria-label="Rules"></button>
        <button class="btn btn-icon" data-action="leave-room" aria-label="Leave game"></button>
      </div>
    </header>

    <main id="table" class="table">
      <div id="opponents" class="opponents"></div>

      <div id="table-center" class="table-center">
        <div class="pile">
          <div class="cardzone zone-deck" data-zone="deck"></div>
          <span class="pile-label">Deck <span id="deck-count">0</span></span>
        </div>
        <div class="pile">
          <div class="cardzone zone-discard" data-zone="discard"></div>
          <span class="pile-label">Discard <span id="discard-count">0</span></span>
        </div>
      </div>

      <div id="self-board" class="self-board"></div>
    </main>

    <div id="prompt" class="prompt" hidden aria-live="polite"></div>

    <footer id="hand-dock" class="hand-dock">
      <div class="hand-bar">
        <span class="hand-label">Hand <span id="hand-count">0</span></span>
        <div class="hand-actions">
          <button id="btn-draw" class="btn" data-action="draw">Draw</button>
          <button id="btn-end-turn" class="btn" data-action="end-turn">End turn</button>
          <button id="btn-emote" class="btn btn-icon" data-action="emote" aria-label="Emote"></button>
          <!-- NOT .btn-danger: ART §1 reserves hazard material for danger, and a
               permanently-striped button in the dock of every table shot spends
               the material before the final-approach rails ever rise. -->
          <button id="btn-scoop" class="btn btn-icon" data-action="scoop" aria-label="Scoop out"></button>
        </div>
      </div>
      <div id="zone-hand" class="cardzone zone-hand" data-zone="hand"></div>
    </footer>

    <aside id="side" class="side" hidden>
      <div class="side-head">
        <span>Mission log</span>
        <button class="btn btn-icon is-close" data-action="toggle-side" aria-label="Close panel"></button>
      </div>
      <div id="log" class="log" aria-live="polite"></div>
      <div class="chat-tabs">
        <button class="btn chat-tab is-on" data-action="chat-scope" data-scope="room">Room</button>
        <button class="btn chat-tab" data-action="chat-scope" data-scope="global">Global</button>
      </div>
      <div id="chat-msgs" class="chat-msgs"></div>
      <div class="chat-row">
        <input id="chat-input" class="field" type="text" maxlength="500" placeholder="Message&hellip;"
               autocomplete="off" aria-label="Chat message">
        <button class="btn" data-action="send-chat">Send</button>
      </div>
    </aside>
  </section>

  <!-- ── OVERLAYS ───────────────────────────────────────────────────── -->
  <div id="sheet" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-panel">
      <div class="sheet-head">
        <h3 id="sheet-title"></h3>
        <button class="btn btn-icon is-close" data-action="close-sheet" aria-label="Close"></button>
      </div>
      <div id="sheet-body" class="sheet-body scroll-edge"></div>
    </div>
  </div>

  <div id="win-overlay" class="win-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="win-title">
    <div class="win-box">
      <div class="win-star" aria-hidden="true">
        <svg viewBox="0 0 100 100" focusable="false">
          <path d="M50 12 61.4 41.3 92.5 43.2 68.4 62.9 76.3 93 50 76.3 23.7 93 31.6 62.9 7.5 43.2 38.6 41.3Z"/>
        </svg>
      </div>
      <h1 id="win-title"></h1>
      <p id="win-reason" class="hint"></p>
      <div id="win-summary" class="win-summary scroll-edge"></div>
      <button id="btn-rematch" class="btn btn-primary" data-action="rematch">Rematch</button>
      <button id="btn-win-leave" class="btn btn-ghost" data-action="leave-room">Leave room</button>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="emotes" class="emotes" aria-hidden="true"></div>
</div>

<script type="module" src="/src/main.js?v=1"></script>
<script src="/demo-visual-tier.js?v=showcase-v5-2"></script></body>
</html>
