  <text x="24" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#24313a">Iron Breakout FPS</text>
  <text x="24" y="51" font-family="Arial, sans-serif" font-size="12" fill="#65757d">Epoch 10 · SEED · Codex game-evolver workflow</text>
  <text x="24" y="344" font-family="Arial, sans-serif" font-size="11" fill="#65757d">The FPS moves from a minimal playable shell toward clearer combat readability, stronger scene dressing, and richer feedback.</text>
