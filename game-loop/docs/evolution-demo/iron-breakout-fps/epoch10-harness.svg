  <g font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#24313a"><text x="89" y="100">Read scene</text><text x="89" y="116">input + camera</text><text x="273" y="100">Edit</text><text x="273" y="116">player-visible</text><text x="457" y="100">Smoke</text><text x="457" y="116">load / aim</text></g>
